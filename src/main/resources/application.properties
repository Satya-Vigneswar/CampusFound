spring.application.name=lostfound

# H2 file database so student accounts survive app restarts during local development.
spring.datasource.url=jdbc:h2:file:./data/campusfind
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create or update tables from JPA entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 web console for local inspection only (http://localhost:8080/h2-console).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
